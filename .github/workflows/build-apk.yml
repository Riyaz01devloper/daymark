name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Web Application
        working-directory: ./frontend
        env:
          VITE_API_URL: https://daymark-3swu.onrender.com
        run: npm run build

      - name: Copy Assets into Android Project
        run: |
          mkdir -p frontend/android/app/src/main/assets/public
          cp -r frontend/dist/* frontend/android/app/src/main/assets/public/
          cp frontend/capacitor.config.json frontend/android/app/src/main/assets/
          echo "[]" > frontend/android/app/src/main/assets/capacitor.plugins.json

      - name: Configure Android SDK Location and Gradlew
        working-directory: ./frontend/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./frontend/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1 || {
            echo "## Gradle Build Error Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daymark-android-apk
          path: frontend/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
